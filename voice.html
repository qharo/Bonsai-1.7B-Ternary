<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonsai 1.7B — Voice Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --accent:    #3fb950;
  --user-bg:   #1f6feb;
  --error:     #f85149;
  --highlight: rgba(255, 235, 59, 0.25);
  --r:         12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.h-logo { font-size: 20px; line-height: 1; }
.h-title { font-weight: 600; font-size: 15px; }
.h-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }

.h-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: all .15s;
}
.h-badge:hover { border-color: var(--accent); }
.h-badge.active { border-color: var(--accent); color: var(--accent); }
.h-badge .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  transition: background .2s;
}
.h-badge.active .dot { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

/* ── Messages ────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Welcome splash */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  text-align: center;
  padding: 40px 20px;
}
.welcome-icon { font-size: 44px; }
.welcome h2   { font-size: 20px; font-weight: 600; color: var(--text); }
.welcome p    { font-size: 13px; max-width: 340px; line-height: 1.65; }

/* Message rows */
.row {
  display: flex;
  flex-direction: column;
  max-width: 78%;
  position: relative;
}
.row.user { align-self: flex-end; align-items: flex-end; }
.row.bot  { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 11px 15px;
  border-radius: var(--r);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.row.user .bubble {
  background: var(--user-bg);
  border-radius: var(--r) var(--r) 3px var(--r);
  color: #fff;
}

.row.bot .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r) var(--r) var(--r) 3px;
}

.row.bot .bubble.error { color: var(--error); }

/* Sentence highlighting */
.sentence {
  display: inline;
  transition: background-color .2s;
  border-radius: 2px;
  padding: 1px 2px;
  margin: -1px -2px;
}
.sentence.highlight {
  background-color: var(--highlight);
}

/* Blinking cursor */
.cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--accent);
  margin-left: 1px;
  vertical-align: text-bottom;
  animation: blink .75s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Audio player */
.audio-player {
  margin-top: 10px;
  padding: 6px 10px;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  max-width: 280px;
}
.audio-player audio {
  width: 100%;
  height: 32px;
}

/* Stats line */
.stats {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  padding: 0 3px;
}

/* ── Input area ──────────────────────────────────────────── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 13px 18px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  padding: 10px 14px;
  font: inherit;
  font-size: 14px;
  resize: none;
  min-height: 44px;
  max-height: 140px;
  line-height: 1.55;
  outline: none;
  transition: border-color .15s;
  overflow-y: auto;
}
textarea:focus       { border-color: #58a6ff; }
textarea::placeholder { color: var(--muted); }

.mic-btn, .send-btn {
  width: 44px; height: 44px;
  border: none;
  border-radius: var(--r);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 20px;
  transition: all .15s;
}

.mic-btn {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}
.mic-btn:hover { border-color: var(--accent); color: var(--accent); }
.mic-btn.recording {
  background: var(--error);
  color: #fff;
  border-color: var(--error);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.send-btn {
  background: var(--accent);
  color: #0d1117;
}
.send-btn:hover:not(:disabled) { opacity: .82; }
.send-btn:disabled {
  background: var(--surface2);
  color: var(--muted);
  cursor: not-allowed;
}

/* ── Error toast ──────────────────────────────────────────── */
.error-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--error);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--r);
  font-size: 13px;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
}
.error-toast.show { opacity: 1; }

/* ── Thinking indicator ─────────────────────────────────── */
.thinking-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 2px 4px;
}
.thinking-dots span {
  width: 6px;
  height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: thinkPulse 1.4s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes thinkPulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<header>
  <span class="h-logo">🌿</span>
  <div>
    <div class="h-title">Bonsai 1.7B — Voice</div>
    <div class="h-sub">Speak or type to chat</div>
  </div>
  <div class="h-badge active" id="voice-toggle" title="Toggle voice output">
    <div class="dot"></div>
    <span id="voice-toggle-text">Voice ON</span>
  </div>
</header>

<div class="messages" id="msgs">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🌿</div>
    <h2>Bonsai 1.7B</h2>
    <p>Hold the mic button to dictate, or type your message.<br>
       Toggle "Voice ON" to hear responses spoken aloud.</p>
  </div>
</div>

<div class="input-area">
  <textarea id="inp" placeholder="Type a message or hold Space to speak..." rows="1" autofocus></textarea>
  <button class="mic-btn" id="mic-btn" title="Hold to speak">🎙</button>
  <button class="send-btn" id="send-btn" title="Send">↑</button>
</div>

<div class="error-toast" id="error-toast"></div>

<script>
const msgsEl      = document.getElementById('msgs');
const welcomeEl   = document.getElementById('welcome');
const inpEl       = document.getElementById('inp');
const sendBtn     = document.getElementById('send-btn');
const micBtn      = document.getElementById('mic-btn');
const voiceToggle = document.getElementById('voice-toggle');
const voiceToggleText = document.getElementById('voice-toggle-text');
const errorToast  = document.getElementById('error-toast');

let ws = null;
let mediaRecorder = null;
let isRecording = false;
let isProcessing = false;
let reconnectAttempts = 0;
const MAX_RECONNECT = 3;
let voiceOutputEnabled = true;
let processingTimeout = null;

// Audio playback
let audioContext = null;
const audioQueue = [];
let thinkingRow = null;
let isPlaying = false;
let currentSentenceIndex = -1;

// Spacebar dictation timer
const SPACEBAR_THRESHOLD_MS = 800;
let spacebarTimer = null;
let spacebarTriggered = false;

// Dictation state
let dictationChunks = [];
let dictationInsertPos = 0;
let dictationOldSelectionEnd = 0;

// First sentence sync (buffer sentence 0 until audio ready)
let pendingFirstSentence = null;
let pendingFirstAudio = null;
let firstSentenceTimeout = null;

function log(label, ...args) {
  console.log(`[${label}]`, ...args);
}

// ── Voice toggle ───────────────────────────────────────────

voiceToggle.addEventListener('click', () => {
  voiceOutputEnabled = !voiceOutputEnabled;
  voiceToggle.classList.toggle('active', voiceOutputEnabled);
  voiceToggleText.textContent = voiceOutputEnabled ? 'Voice ON' : 'Voice OFF';
  log('TOGGLE', 'Voice output:', voiceOutputEnabled);
});

// ── WebSocket ──────────────────────────────────────────────

function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}/ws/voice`;
  log('WS', 'Connecting to', wsUrl);

  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    log('WS', 'Connected');
    reconnectAttempts = 0;
    sendBtn.disabled = false;
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      log('WS', '←', data.type, data);
      handleMessage(data);
    } catch (e) {
      log('WS', 'Parse error:', e);
    }
  };

  ws.onerror = (err) => {
    log('WS', 'Error:', err);
    showError('Connection error');
  };

  ws.onclose = (event) => {
    log('WS', 'Closed. Code:', event.code);
    sendBtn.disabled = true;
    if (reconnectAttempts < MAX_RECONNECT) {
      reconnectAttempts++;
      setTimeout(connectWebSocket, 2000);
    }
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'status':
      if (data.done) {
        clearProcessingTimeout();
        isProcessing = false;
        sendBtn.disabled = false;
        micBtn.disabled = false;
      }
      break;

    case 'dictation':
      {
        const before = inpEl.value.substring(0, dictationInsertPos);
        const after = inpEl.value.substring(dictationOldSelectionEnd);
        inpEl.value = before + data.text + after;
        inpEl.selectionStart = inpEl.selectionEnd = dictationInsertPos + data.text.length;
        autoResizeTextarea();
        inpEl.focus();
      }
      break;

    case 'llm_text':
      hideThinkingIndicator();
      if (data.index === 0 && voiceOutputEnabled) {
        // Buffer first sentence until audio is ready
        pendingFirstSentence = {text: data.text, index: 0};
        setFirstSentenceTimeout();
        checkFirstSentenceReady();
      } else {
        appendBotSentence(data.text, data.index);
      }
      break;

    case 'audio':
      hideThinkingIndicator();
      if (data.index === 0) {
        if (voiceOutputEnabled) {
          pendingFirstAudio = {data: data.data, index: 0};
          checkFirstSentenceReady();
        }
      } else {
        if (voiceOutputEnabled) {
          queueAudio(data.data, data.index);
        }
      }
      break;

    case 'error':
      hideThinkingIndicator();
      clearProcessingTimeout();
      showError(data.message);
      isProcessing = false;
      sendBtn.disabled = false;
      micBtn.disabled = false;
      break;
  }
}

// ── Message UI ───────────────────────────────────────────

function appendUser(text) {
  welcomeEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  scrollBottom();
}

let currentBotRow = null;
let sentenceElements = {};

function showThinkingIndicator() {
  hideThinkingIndicator();
  welcomeEl.style.display = 'none';
  thinkingRow = document.createElement('div');
  thinkingRow.className = 'row bot';
  thinkingRow.id = 'thinking-row';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
  thinkingRow.appendChild(b);
  msgsEl.appendChild(thinkingRow);
  scrollBottom();
}

function hideThinkingIndicator() {
  if (thinkingRow) {
    thinkingRow.remove();
    thinkingRow = null;
  }
}

function startBotMessage() {
  welcomeEl.style.display = 'none';
  currentBotRow = document.createElement('div');
  currentBotRow.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.id = 'current-bot-bubble';
  const cur = document.createElement('span');
  cur.className = 'cursor';
  b.appendChild(cur);
  currentBotRow.appendChild(b);
  msgsEl.appendChild(currentBotRow);
  sentenceElements = {};
  scrollBottom();
  return b;
}

function appendBotSentence(text, index) {
  let bubble = document.getElementById('current-bot-bubble');
  if (!bubble) {
    bubble = startBotMessage();
  }

  // Remove cursor
  const cur = bubble.querySelector('.cursor');
  if (cur) cur.remove();

  // Create sentence span
  const span = document.createElement('span');
  span.className = 'sentence';
  span.dataset.index = index;
  span.textContent = text;
  bubble.appendChild(span);

  // Add cursor back
  const newCur = document.createElement('span');
  newCur.className = 'cursor';
  bubble.appendChild(newCur);

  sentenceElements[index] = span;
  scrollBottom();
}

function finishBotMessage() {
  const bubble = document.getElementById('current-bot-bubble');
  if (bubble) {
    const cur = bubble.querySelector('.cursor');
    if (cur) cur.remove();
    bubble.removeAttribute('id');
  }
  currentBotRow = null;
  sentenceElements = {};
}

// ── Audio playback with highlighting ──────────────────────

async function ensureAudioContext() {
  if (!audioContext) audioContext = new AudioContext();
  if (audioContext.state === 'suspended') await audioContext.resume();
  return audioContext;
}

function queueAudio(base64Data, sentenceIndex) {
  if (!base64Data) return;
  try {
    log('PLAY', 'Queueing sentence', sentenceIndex);
    audioQueue.push({ base64: base64Data, index: sentenceIndex });
    if (!isPlaying) playNext();
  } catch (e) {
    log('PLAY', 'Queue error:', e);
  }
}

async function playNext() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    currentSentenceIndex = -1;
    clearAllHighlights();
    return;
  }

  isPlaying = true;
  const item = audioQueue.shift();
  currentSentenceIndex = item.index;

  // Highlight current sentence
  highlightSentence(item.index);

  try {
    await ensureAudioContext();
    const audioBytes = base64ToArrayBuffer(item.base64);
    const audioBuffer = await audioContext.decodeAudioData(audioBytes);
    log('PLAY', 'Playing sentence', item.index, audioBuffer.duration.toFixed(2) + 's');

    const bufSource = audioContext.createBufferSource();
    bufSource.buffer = audioBuffer;
    bufSource.connect(audioContext.destination);
    bufSource.onended = () => {
      log('PLAY', 'Finished sentence', item.index);
      playNext();
    };
    bufSource.start();
  } catch (err) {
    log('PLAY', 'Playback error:', err.name, err.message);
    playNext();
  }
}

function highlightSentence(index) {
  clearAllHighlights();
  const span = sentenceElements[index];
  if (span) {
    span.classList.add('highlight');
    log('UI', 'Highlight sentence', index);
  }
}

function clearAllHighlights() {
  Object.values(sentenceElements).forEach(span => {
    span.classList.remove('highlight');
  });
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ── First sentence sync helpers ───────────────────────────

function checkFirstSentenceReady() {
  if (pendingFirstSentence && pendingFirstAudio) {
    appendBotSentence(pendingFirstSentence.text, pendingFirstSentence.index);
    queueAudio(pendingFirstAudio.data, pendingFirstAudio.index);
    pendingFirstSentence = null;
    pendingFirstAudio = null;
    if (firstSentenceTimeout) {
      clearTimeout(firstSentenceTimeout);
      firstSentenceTimeout = null;
    }
  }
}

function setFirstSentenceTimeout() {
  if (firstSentenceTimeout) clearTimeout(firstSentenceTimeout);
  firstSentenceTimeout = setTimeout(() => {
    if (pendingFirstSentence) {
      // Audio never arrived — show text anyway
      appendBotSentence(pendingFirstSentence.text, pendingFirstSentence.index);
      pendingFirstSentence = null;
      pendingFirstAudio = null;
      firstSentenceTimeout = null;
    }
  }, 5000);
}

// ── Dictation (hold mic) ──────────────────────────────────

async function startDictation() {
  if (isProcessing) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showError('Not connected');
    return;
  }

  try {
    log('MIC', 'Requesting microphone...');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    const mimeType = getSupportedMimeType();
    log('MIC', 'MIME type:', mimeType);

    mediaRecorder = new MediaRecorder(stream, { mimeType });

    // Reset dictation state
    dictationChunks = [];

    // Save cursor position for dictation insertion
    dictationInsertPos = inpEl.selectionStart;
    dictationOldSelectionEnd = inpEl.selectionEnd;

    // Signal server that streaming dictation is starting
    ws.send(JSON.stringify({type: 'start_dictation'}));

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) dictationChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      log('MIC', 'Dictation stopped, chunks:', dictationChunks.length);
      stream.getTracks().forEach(t => t.stop());

      // Send complete audio blob once at the end
      const audioBlob = new Blob(dictationChunks, { type: mimeType });
      const arrayBuffer = await audioBlob.arrayBuffer();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(arrayBuffer);
        log('MIC', 'Final blob sent:', arrayBuffer.byteLength);
      }

      // Signal server that streaming dictation has stopped
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: 'stop_dictation'}));
      }

      micBtn.classList.remove('recording');
    };

    mediaRecorder.start(100);
    isRecording = true;
    micBtn.classList.add('recording');
    log('MIC', 'Dictation recording (end-only mode)');

  } catch (err) {
    log('MIC', 'Error:', err.name, err.message);
    if (err.name === 'NotAllowedError') showError('Microphone permission denied');
    else if (err.name === 'NotFoundError') showError('No microphone found');
    else showError('Error: ' + err.message);
  }
}

function stopDictation() {
  if (!isRecording || !mediaRecorder) return;

  isRecording = false;
  micBtn.classList.remove('recording');
  if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function getSupportedMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg', 'audio/mp4'];
  for (const type of types) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

// ── Chat send ────────────────────────────────────────────

function sendChat() {
  const text = inpEl.value.trim();
  if (!text || isProcessing) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showError('Not connected');
    return;
  }

  // Show user message
  appendUser(text);
  inpEl.value = '';
  autoResizeTextarea();

  // Clear previous bot state and show thinking indicator
  finishBotMessage();
  showThinkingIndicator();

  // Clear first sentence sync state for new chat
  pendingFirstSentence = null;
  pendingFirstAudio = null;
  if (firstSentenceTimeout) {
    clearTimeout(firstSentenceTimeout);
    firstSentenceTimeout = null;
  }

  // Send chat message
  isProcessing = true;
  sendBtn.disabled = true;
  micBtn.disabled = true;

  ws.send(JSON.stringify({
    type: 'chat',
    text: text,
    voice_output: voiceOutputEnabled
  }));

  setProcessingTimeout();
  log('CHAT', 'Sent:', text.substring(0, 60));
}

// ── Helpers ──────────────────────────────────────────────

function autoResizeTextarea() {
  inpEl.style.height = 'auto';
  inpEl.style.height = Math.min(inpEl.scrollHeight, 140) + 'px';
}

function scrollBottom() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showError(msg) {
  errorToast.textContent = msg;
  errorToast.classList.add('show');
  setTimeout(() => errorToast.classList.remove('show'), 4000);
}

function setProcessingTimeout() {
  clearProcessingTimeout();
  processingTimeout = setTimeout(() => {
    hideThinkingIndicator();
    showError('Server response timeout');
    isProcessing = false;
    sendBtn.disabled = false;
    micBtn.disabled = false;
  }, 15000);
}

function clearProcessingTimeout() {
  if (processingTimeout) {
    clearTimeout(processingTimeout);
    processingTimeout = null;
  }
}

// ── Event listeners ───────────────────────────────────────

micBtn.addEventListener('mousedown', startDictation);
micBtn.addEventListener('mouseup', stopDictation);
micBtn.addEventListener('mouseleave', () => { if (isRecording) stopDictation(); });

micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startDictation(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopDictation(); });

sendBtn.addEventListener('click', sendChat);

inpEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

// Global Spacebar dictation: hold for >800ms to trigger voice recording
// Works anywhere on the page, not just when textarea is focused
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && !isRecording && !isProcessing && !e.ctrlKey && !e.altKey && !e.metaKey) {
    // Don't capture space when typing in input/textarea (unless holding)
    // We still preventDefault immediately to avoid inserting spaces before dictation starts
    e.preventDefault();
    spacebarTriggered = false;
    spacebarTimer = setTimeout(() => {
      spacebarTriggered = true;
      log('DICT', 'Spacebar hold threshold reached, starting dictation');
      startDictation();
    }, SPACEBAR_THRESHOLD_MS);
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    if (spacebarTimer) {
      clearTimeout(spacebarTimer);
      spacebarTimer = null;
    }
    if (isRecording && spacebarTriggered) {
      // Was triggered by timer — stop dictation
      stopDictation();
    } else if (!spacebarTriggered) {
      // Quick tap — if typing in textarea, insert a single space
      if (document.activeElement === inpEl) {
        const start = inpEl.selectionStart;
        const end = inpEl.selectionEnd;
        const value = inpEl.value;
        inpEl.value = value.substring(0, start) + ' ' + value.substring(end);
        inpEl.selectionStart = inpEl.selectionEnd = start + 1;
        inpEl.dispatchEvent(new Event('input'));
        log('DICT', 'Spacebar quick tap — inserted space');
      }
    }
  }
});

inpEl.addEventListener('input', autoResizeTextarea);

// ── Init ─────────────────────────────────────────────────

connectWebSocket();
</script>

</body>
</html>
