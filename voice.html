<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonsai 1.7B — Voice Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --accent:    #3fb950;
  --user-bg:   #1f6feb;
  --error:     #f85149;
  --r:         12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.h-logo { font-size: 20px; line-height: 1; }

.h-title { font-weight: 600; font-size: 15px; }
.h-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }

.h-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent);
  flex-shrink: 0;
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .2s;
}
.status-dot.recording { background: var(--error); box-shadow: 0 0 5px var(--error); }
.status-dot.processing { background: #f0883e; box-shadow: 0 0 5px #f0883e; }
.status-dot.ready { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

/* ── Main content ───────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 40px 20px;
}

/* ── Mic button ─────────────────────────────────────────── */
.mic-wrap {
  position: relative;
}

.mic-btn {
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 3px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  position: relative;
}

.mic-btn:hover { border-color: var(--accent); }
.mic-btn.recording {
  border-color: var(--error);
  background: rgba(248, 81, 73, 0.1);
  animation: pulse 1.5s ease-in-out infinite;
}
.mic-btn.processing {
  border-color: #f0883e;
  background: rgba(240, 136, 62, 0.1);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248,81,73,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(248,81,73,0); }
}

/* Ring animation when listening */
.mic-ring {
  position: absolute;
  top: -8px; left: -8px; right: -8px; bottom: -8px;
  border-radius: 50%;
  border: 2px solid var(--error);
  opacity: 0;
  transition: opacity .2s;
}
.mic-btn.recording + .mic-ring { opacity: 1; animation: ring-pulse 2s ease-out infinite; }

@keyframes ring-pulse {
  0% { transform: scale(0.95); opacity: 1; }
  100% { transform: scale(1.3); opacity: 0; }
}

/* ── Status text ────────────────────────────────────────── */
.status-text {
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  min-height: 22px;
}

/* ── Transcript area ──────────────────────────────────────── */
.transcript-area {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.transcript-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 18px;
}

.transcript-block .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 6px;
}

.transcript-block .text {
  font-size: 15px;
  line-height: 1.6;
}

.transcript-block.user .label { color: var(--user-bg); }
.transcript-block.bot .label { color: var(--accent); }

/* ── Timing stats ─────────────────────────────────────────── */
.stats-line {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
}

/* ── Error toast ──────────────────────────────────────────── */
.error-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--error);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--r);
  font-size: 13px;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
}
.error-toast.show { opacity: 1; }

/* ── Link back ──────────────────────────────────────────── */
.back-link {
  position: fixed;
  bottom: 16px;
  left: 16px;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}
.back-link:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <span class="h-logo">🌿</span>
  <div>
    <div class="h-title">Bonsai 1.7B — Voice</div>
    <div class="h-sub">Speak to the 1.58-bit model</div>
  </div>
  <div class="h-badge">
    <div class="status-dot" id="status-dot"></div>
    <span id="badge-text">Initializing...</span>
  </div>
</header>

<main>
  <div class="mic-wrap">
    <button class="mic-btn" id="mic-btn" title="Hold to speak">🎙</button>
    <div class="mic-ring"></div>
  </div>
  
  <div class="status-text" id="status-text">Connect to start voice chat</div>
  
  <div class="transcript-area" id="transcript-area">
    <!-- Transcript blocks will appear here -->
  </div>
  
  <div class="stats-line" id="stats-line"></div>
</main>

<div class="error-toast" id="error-toast"></div>

<a href="/" class="back-link">← Text chat</a>

<script>
const micBtn       = document.getElementById('mic-btn');
const statusText   = document.getElementById('status-text');
const statusDot    = document.getElementById('status-dot');
const badgeText    = document.getElementById('badge-text');
const transcriptEl = document.getElementById('transcript-area');
const statsLine    = document.getElementById('stats-line');
const errorToast   = document.getElementById('error-toast');

let ws = null;
let audioContext = null;
let mediaStream = null;
let processor = null;
let source = null;
let isRecording = false;
let isProcessing = false;

// Audio queue for playback
const audioQueue = [];
let isPlaying = false;

// ── WebSocket ──────────────────────────────────────────────

function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}/ws/voice`;
  
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  
  ws.onopen = () => {
    console.log('[WS] Connected');
    setStatus('ready', 'Connected — hold mic to speak');
    // Send config
    ws.send(JSON.stringify({type: 'config', format: 'pcm'}));
  };
  
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleMessage(data);
  };
  
  ws.onerror = (err) => {
    console.error('[WS] Error:', err);
    showError('Connection error');
    setStatus('error', 'Connection error');
  };
  
  ws.onclose = () => {
    console.log('[WS] Closed');
    setStatus('error', 'Disconnected — refresh to reconnect');
    micBtn.disabled = true;
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'status':
      statusText.textContent = data.message;
      if (data.done) {
        isProcessing = false;
        setStatus('ready', 'Ready');
        micBtn.classList.remove('processing');
        
        if (data.total_time_s) {
          statsLine.textContent = 
            `Total: ${data.total_time_s}s · LLM: ${data.llm_time_s}s · TTS: ${data.tts_time_s}s · ${data.tokens_per_second} t/s`;
        }
      }
      break;
      
    case 'transcription':
      addTranscript('user', data.text);
      break;
      
    case 'llm_text':
      appendBotText(data.text);
      break;
      
    case 'audio':
      playAudio(data.data);
      break;
      
    case 'error':
      showError(data.message);
      isProcessing = false;
      setStatus('ready', 'Ready');
      micBtn.classList.remove('processing');
      break;
      
    case 'pong':
      break;
  }
}

// ── Audio Capture ──────────────────────────────────────────

async function startRecording() {
  if (isProcessing) return;
  
  try {
    if (!audioContext) {
      audioContext = new AudioContext({ sampleRate: 16000 });
    }
    
    if (!mediaStream) {
      mediaStream = await navigator.mediaDevices.getUserMedia({ 
        audio: {
          sampleRate: 16000,
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
        }
      });
    }
    
    source = audioContext.createMediaStreamSource(mediaStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    
    processor.onaudioprocess = (e) => {
      if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
      
      const inputData = e.inputBuffer.getChannelData(0);
      // Convert float32 to int16
      const int16Data = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
      }
      
      ws.send(int16Data.buffer);
    };
    
    source.connect(processor);
    processor.connect(audioContext.destination);
    
    isRecording = true;
    micBtn.classList.add('recording');
    setStatus('recording', 'Listening...');
    statusText.textContent = 'Speak now...';
    
  } catch (err) {
    console.error('Mic error:', err);
    showError('Microphone access denied or not available');
  }
}

function stopRecording() {
  isRecording = false;
  micBtn.classList.remove('recording');
  
  if (processor) {
    processor.disconnect();
    processor = null;
  }
  if (source) {
    source.disconnect();
    source = null;
  }
  
  isProcessing = true;
  micBtn.classList.add('processing');
  setStatus('processing', 'Processing...');
  statusText.textContent = 'Processing your speech...';
}

// ── Audio Playback ─────────────────────────────────────────

async function playAudio(base64Data) {
  const audioBytes = base64ToArrayBuffer(base64Data);
  audioQueue.push(audioBytes);
  
  if (!isPlaying) {
    playNext();
  }
}

async function playNext() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    return;
  }
  
  isPlaying = true;
  const audioBytes = audioQueue.shift();
  
  try {
    if (!audioContext) {
      audioContext = new AudioContext({ sampleRate: 22050 });
    }
    
    // Decode WAV data
    const audioBuffer = await audioContext.decodeAudioData(audioBytes);
    const source = audioContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioContext.destination);
    source.onended = playNext;
    source.start();
  } catch (err) {
    console.error('Audio playback error:', err);
    playNext();  // Skip and continue
  }
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

// ── UI helpers ─────────────────────────────────────────────

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  badgeText.textContent = text;
}

function addTranscript(role, text) {
  const block = document.createElement('div');
  block.className = 'transcript-block ' + role;
  block.innerHTML = `
    <div class="label">${role === 'user' ? 'You' : 'Bonsai'}</div>
    <div class="text">${escapeHtml(text)}</div>
  `;
  transcriptEl.appendChild(block);
  scrollToBottom();
}

let currentBotBlock = null;

function appendBotText(text) {
  if (!currentBotBlock) {
    currentBotBlock = document.createElement('div');
    currentBotBlock.className = 'transcript-block bot';
    currentBotBlock.innerHTML = '<div class="label">Bonsai</div><div class="text"></div>';
    transcriptEl.appendChild(currentBotBlock);
  }
  const textEl = currentBotBlock.querySelector('.text');
  textEl.textContent += text;
  scrollToBottom();
}

function scrollToBottom() {
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function showError(msg) {
  errorToast.textContent = msg;
  errorToast.classList.add('show');
  setTimeout(() => errorToast.classList.remove('show'), 4000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Event listeners ────────────────────────────────────────

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', () => {
  if (isRecording) stopRecording();
});

// Touch support
micBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startRecording();
});
micBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  stopRecording();
});

// Keyboard shortcut (spacebar)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !isRecording && !isProcessing && e.target === document.body) {
    e.preventDefault();
    startRecording();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && isRecording) {
    e.preventDefault();
    stopRecording();
  }
});

// ── Init ───────────────────────────────────────────────────

connectWebSocket();
</script>

</body>
</html>
