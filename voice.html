<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonsai 1.7B — Voice Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --accent:    #3fb950;
  --user-bg:   #1f6feb;
  --error:     #f85149;
  --r:         12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.h-logo { font-size: 20px; line-height: 1; }
.h-title { font-weight: 600; font-size: 15px; }
.h-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }

.h-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .2s;
}
.status-dot.recording { background: var(--error); box-shadow: 0 0 5px var(--error); }
.status-dot.processing { background: #f0883e; box-shadow: 0 0 5px #f0883e; }
.status-dot.ready { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 40px 20px;
  overflow-y: auto;
}

/* Mic button */
.mic-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.mic-btn {
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 3px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  position: relative;
}

.mic-btn:hover { border-color: var(--accent); }
.mic-btn.recording {
  border-color: var(--error);
  background: rgba(248, 81, 73, 0.1);
  animation: pulse 1.5s ease-in-out infinite;
}
.mic-btn.processing {
  border-color: #f0883e;
  background: rgba(240, 136, 62, 0.1);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(248,81,73,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(248,81,73,0); }
}

/* Audio level bar */
.level-bar {
  width: 120px;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
  opacity: 0;
  transition: opacity .2s;
}
.level-bar.active { opacity: 1; }
.level-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .05s linear;
}

/* Status */
.status-text {
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  min-height: 22px;
}

/* Transcript */
.transcript-area {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  max-height: 50vh;
}

.transcript-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 18px;
}
.transcript-block .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.transcript-block .text {
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.transcript-block.user .label { color: var(--user-bg); }
.transcript-block.bot .label { color: var(--accent); }

/* Stats */
.stats-line {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
  min-height: 16px;
}

/* Toast */
.error-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--error);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--r);
  font-size: 13px;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 100;
}
.error-toast.show { opacity: 1; }

.back-link {
  position: fixed;
  bottom: 16px;
  left: 16px;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}
.back-link:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <span class="h-logo">🌿</span>
  <div>
    <div class="h-title">Bonsai 1.7B — Voice</div>
    <div class="h-sub">Speak to the 1.58-bit model</div>
  </div>
  <div class="h-badge">
    <div class="status-dot" id="status-dot"></div>
    <span id="badge-text">Connecting...</span>
  </div>
</header>

<main>
  <div class="mic-wrap">
    <button class="mic-btn" id="mic-btn" title="Hold to speak" disabled>🎙</button>
    <div class="level-bar" id="level-bar">
      <div class="level-fill" id="level-fill"></div>
    </div>
  </div>
  
  <div class="status-text" id="status-text">Connecting to voice server...</div>
  
  <div class="transcript-area" id="transcript-area"></div>
  <div class="stats-line" id="stats-line"></div>
</main>

<div class="error-toast" id="error-toast"></div>
<a href="/" class="back-link">← Text chat</a>

<script>
const micBtn       = document.getElementById('mic-btn');
const statusText   = document.getElementById('status-text');
const statusDot    = document.getElementById('status-dot');
const badgeText    = document.getElementById('badge-text');
const transcriptEl = document.getElementById('transcript-area');
const statsLine    = document.getElementById('stats-line');
const errorToast   = document.getElementById('error-toast');
const levelBar     = document.getElementById('level-bar');
const levelFill    = document.getElementById('level-fill');

let ws = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isProcessing = false;
let reconnectAttempts = 0;
const MAX_RECONNECT = 3;
let processingTimeout = null;
let analyser = null;
let animationId = null;

// Audio queue for playback
const audioQueue = [];
let isPlaying = false;
let audioContext = null;

function log(label, ...args) {
  console.log(`[${label}]`, ...args);
}

// ── WebSocket ──────────────────────────────────────────────

function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}/ws/voice`;
  
  log('WS', 'Connecting to', wsUrl);
  
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  
  ws.onopen = () => {
    log('WS', 'Connected');
    reconnectAttempts = 0;
    micBtn.disabled = false;
    setStatus('ready', 'Ready');
    statusText.textContent = 'Hold the microphone button to speak';
  };
  
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      log('WS', '←', data.type, data);
      handleMessage(data);
    } catch (e) {
      log('WS', 'Parse error:', e);
    }
  };
  
  ws.onerror = (err) => {
    log('WS', 'Error:', err);
    showError('Connection error');
    setStatus('error', 'Connection error');
  };
  
  ws.onclose = (event) => {
    log('WS', 'Closed. Code:', event.code, 'Reason:', event.reason);
    setStatus('error', 'Disconnected');
    micBtn.disabled = true;
    
    if (reconnectAttempts < MAX_RECONNECT) {
      reconnectAttempts++;
      log('WS', `Reconnecting in 2s (attempt ${reconnectAttempts}/${MAX_RECONNECT})`);
      setTimeout(connectWebSocket, 2000);
    } else {
      setStatus('error', 'Disconnected — refresh to reconnect');
      statusText.textContent = 'Connection lost. Please refresh the page.';
    }
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'status':
      statusText.textContent = data.message;
      if (data.done) {
        clearProcessingTimeout();
        isProcessing = false;
        setStatus('ready', 'Ready');
        micBtn.classList.remove('processing');
        micBtn.disabled = false;
        
        if (data.total_time_s) {
          statsLine.textContent = 
            `Total: ${data.total_time_s}s · LLM: ${data.llm_time_s}s · TTS: ${data.tts_time_s}s · ${data.tokens_per_second} t/s`;
        }
        currentBotBlock = null;
      }
      break;
      
    case 'transcription':
      addTranscript('user', data.text);
      break;
      
    case 'llm_text':
      appendBotText(data.text);
      break;
      
    case 'audio':
      log('AUDIO', 'Received chunk, base64 length:', data.data ? data.data.length : 0);
      playAudio(data.data);
      break;
      
    case 'error':
      clearProcessingTimeout();
      showError(data.message);
      isProcessing = false;
      setStatus('ready', 'Ready');
      micBtn.classList.remove('processing');
      micBtn.disabled = false;
      break;
      
    case 'pong':
      break;
      
    default:
      log('WS', 'Unknown message type:', data.type);
  }
}

// ── Audio Capture (MediaRecorder) ──────────────────────────

async function ensureAudioContext() {
  if (!audioContext) {
    audioContext = new AudioContext();
  }
  if (audioContext.state === 'suspended') {
    await audioContext.resume();
  }
  return audioContext;
}

async function startRecording() {
  if (isProcessing) {
    log('MIC', 'Cannot start — still processing');
    return;
  }
  
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    showError('Not connected');
    return;
  }
  
  try {
    log('MIC', 'Requesting microphone...');
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });
    
    log('MIC', 'Microphone access granted');
    
    // Setup audio analysis for level meter
    await ensureAudioContext();
    const audioSource = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    audioSource.connect(analyser);
    
    // Start level meter animation
    levelBar.classList.add('active');
    animateLevel();
    
    // Setup MediaRecorder
    const mimeType = getSupportedMimeType();
    log('MIC', 'Using MIME type:', mimeType);
    
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];
    
    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
        log('MIC', 'Chunk received:', event.data.size, 'bytes');
      }
    };
    
    mediaRecorder.onstop = async () => {
      log('MIC', 'Recording stopped, chunks:', audioChunks.length);
      
      // Stop level meter
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      levelBar.classList.remove('active');
      levelFill.style.width = '0%';
      
      // Stop all tracks
      stream.getTracks().forEach(t => t.stop());
      
      if (audioChunks.length === 0) {
        log('MIC', 'No audio captured');
        isProcessing = false;
        setStatus('ready', 'Ready');
        micBtn.classList.remove('processing');
        micBtn.disabled = false;
        statusText.textContent = 'No audio captured. Try again.';
        return;
      }
      
      // Combine chunks into blob
      const audioBlob = new Blob(audioChunks, { type: mimeType });
      log('MIC', 'Total blob size:', audioBlob.size, 'bytes');
      
      // Convert to ArrayBuffer and send
      const arrayBuffer = await audioBlob.arrayBuffer();
      log('MIC', 'Sending', arrayBuffer.byteLength, 'bytes to server');
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(arrayBuffer);
        log('MIC', 'Audio sent');
        
        // Set processing state
        isProcessing = true;
        micBtn.classList.add('processing');
        micBtn.disabled = true;
        setStatus('processing', 'Processing...');
        statusText.textContent = 'Processing your speech...';
        
        // Set timeout to reset UI if server doesn't respond
        setProcessingTimeout();
      } else {
        showError('Connection lost during recording');
        isProcessing = false;
        setStatus('error', 'Disconnected');
        micBtn.disabled = false;
      }
    };
    
    mediaRecorder.onerror = (e) => {
      log('MIC', 'MediaRecorder error:', e);
      showError('Recording error: ' + e.message);
      stopRecording();
    };
    
    // Start recording with 100ms timeslice to get chunks
    mediaRecorder.start(100);
    isRecording = true;
    micBtn.classList.add('recording');
    setStatus('recording', 'Listening...');
    statusText.textContent = 'Speak now... release to stop';
    log('MIC', 'Recording started');
    
  } catch (err) {
    log('MIC', 'Error:', err.name, err.message);
    
    if (err.name === 'NotAllowedError') {
      showError('Microphone permission denied');
      statusText.textContent = 'Please allow microphone access in your browser.';
    } else if (err.name === 'NotFoundError') {
      showError('No microphone found');
      statusText.textContent = 'No microphone detected. Please connect one.';
    } else {
      showError('Error: ' + err.message);
      statusText.textContent = 'Error: ' + err.message;
    }
  }
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  
  log('MIC', 'Stopping recording...');
  isRecording = false;
  micBtn.classList.remove('recording');
  
  if (mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function getSupportedMimeType() {
  const types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
    'audio/mp4',
  ];
  for (const type of types) {
    if (MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }
  return ''; // Let browser choose default
}

function animateLevel() {
  if (!analyser) return;
  
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  
  // Calculate average volume
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  const average = sum / dataArray.length;
  const percentage = Math.min(100, (average / 128) * 100);
  
  levelFill.style.width = percentage + '%';
  
  animationId = requestAnimationFrame(animateLevel);
}

// ── Processing timeout ─────────────────────────────────────

function setProcessingTimeout() {
  clearProcessingTimeout();
  processingTimeout = setTimeout(() => {
    log('TIMEOUT', 'No response from server after 15s');
    showError('Server response timeout — please try again');
    isProcessing = false;
    setStatus('ready', 'Ready');
    micBtn.classList.remove('processing');
    micBtn.disabled = false;
    statusText.textContent = 'Timed out. Hold mic to speak again.';
  }, 15000);
}

function clearProcessingTimeout() {
  if (processingTimeout) {
    clearTimeout(processingTimeout);
    processingTimeout = null;
  }
}

// ── Audio Playback ─────────────────────────────────────────

async function playAudio(base64Data) {
  if (!base64Data) {
    log('PLAY', 'Empty audio data');
    return;
  }
  
  try {
    const audioBytes = base64ToArrayBuffer(base64Data);
    log('PLAY', 'Queueing audio:', audioBytes.byteLength, 'bytes');
    audioQueue.push(audioBytes);
    
    if (!isPlaying) {
      playNext();
    }
  } catch (e) {
    log('PLAY', 'Error queueing audio:', e);
  }
}

async function playNext() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    log('PLAY', 'Queue empty');
    return;
  }
  
  isPlaying = true;
  const audioBytes = audioQueue.shift();
  
  try {
    await ensureAudioContext();
    
    log('PLAY', 'Decoding audio...');
    const audioBuffer = await audioContext.decodeAudioData(audioBytes);
    log('PLAY', 'Audio decoded:', audioBuffer.duration.toFixed(2), 's');
    
    const bufSource = audioContext.createBufferSource();
    bufSource.buffer = audioBuffer;
    bufSource.connect(audioContext.destination);
    bufSource.onended = () => {
      log('PLAY', 'Audio finished');
      playNext();
    };
    bufSource.start();
  } catch (err) {
    log('PLAY', 'Playback error:', err.name, err.message);
    playNext();  // Skip and continue
  }
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

// ── UI helpers ─────────────────────────────────────────────

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  badgeText.textContent = text;
}

function addTranscript(role, text) {
  currentBotBlock = null;
  const block = document.createElement('div');
  block.className = 'transcript-block ' + role;
  block.innerHTML = `
    <div class="label">${role === 'user' ? 'You' : 'Bonsai'}</div>
    <div class="text">${escapeHtml(text)}</div>
  `;
  transcriptEl.appendChild(block);
  scrollToBottom();
}

let currentBotBlock = null;

function appendBotText(text) {
  if (!currentBotBlock) {
    currentBotBlock = document.createElement('div');
    currentBotBlock.className = 'transcript-block bot';
    currentBotBlock.innerHTML = '<div class="label">Bonsai</div><div class="text"></div>';
    transcriptEl.appendChild(currentBotBlock);
  }
  const textEl = currentBotBlock.querySelector('.text');
  textEl.textContent += text;
  scrollToBottom();
}

function scrollToBottom() {
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function showError(msg) {
  errorToast.textContent = msg;
  errorToast.classList.add('show');
  setTimeout(() => errorToast.classList.remove('show'), 4000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Event listeners ────────────────────────────────────────

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', () => {
  if (isRecording) stopRecording();
});

// Touch support
micBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startRecording();
});
micBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  stopRecording();
});

// Keyboard shortcut
let spacePressed = false;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !spacePressed && !isRecording && !isProcessing && e.target === document.body) {
    e.preventDefault();
    spacePressed = true;
    startRecording();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && spacePressed) {
    e.preventDefault();
    spacePressed = false;
    stopRecording();
  }
});

// ── Init ───────────────────────────────────────────────────

log('INIT', 'Voice chat initializing...');
connectWebSocket();
</script>

</body>
</html>
