<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonsai 1.7B — A 1.58-bit Ternary LLM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --muted:     #8b949e;
  --accent:    #3fb950;
  --user-bg:   #1f6feb;
  --error:     #f85149;
  --r:         12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.h-logo { font-size: 20px; line-height: 1; }

.h-title { font-weight: 600; font-size: 15px; }
.h-sub   { font-size: 11px; color: var(--muted); margin-top: 1px; }

.h-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent);
  flex-shrink: 0;
}

/* ── Messages ────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Welcome splash */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  text-align: center;
  padding: 40px 20px;
  pointer-events: none;
}
.welcome-icon { font-size: 44px; }
.welcome h2   { font-size: 20px; font-weight: 600; color: var(--text); }
.welcome p    { font-size: 13px; max-width: 340px; line-height: 1.65; }
.welcome a    { color: var(--accent); text-decoration: none; }
.welcome a:hover { text-decoration: underline; }

/* Message rows */
.row {
  display: flex;
  flex-direction: column;
  max-width: 78%;
  position: relative;
}
.row.user { align-self: flex-end; align-items: flex-end; }
.row.bot  { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 11px 15px;
  border-radius: var(--r);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.row.user .bubble {
  background: var(--user-bg);
  border-radius: var(--r) var(--r) 3px var(--r);
  color: #fff;
}

.row.bot .bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r) var(--r) var(--r) 3px;
}

.row.bot .bubble.error { color: var(--error); }

/* Blinking cursor */
.cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--accent);
  margin-left: 1px;
  vertical-align: text-bottom;
  animation: blink .75s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Stats line */
.stats {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  padding: 0 3px;
}

/* ── Input area ──────────────────────────────────────────── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 13px 18px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  padding: 10px 14px;
  font: inherit;
  font-size: 14px;
  resize: none;
  min-height: 44px;
  max-height: 140px;
  line-height: 1.55;
  outline: none;
  transition: border-color .15s;
  overflow-y: auto;
}
textarea:focus       { border-color: #58a6ff; }
textarea::placeholder { color: var(--muted); }

.send, .stop {
  background: var(--accent);
  color: #0d1117;
  border: none;
  border-radius: var(--r);
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 18px; font-weight: 700; line-height: 1;
  transition: opacity .15s;
}

.stop {
  background: var(--error);
  color: #fff;
}

.send:disabled, .stop:disabled {
  background: var(--surface2);
  color: var(--muted);
  cursor: not-allowed;
}

.send:hover:not(:disabled), .stop:hover:not(:disabled) {
  opacity: .82;
}
</style>
</head>
<body>

<header>
  <span class="h-logo">🌿</span>
  <div>
    <div class="h-title">Bonsai 1.7B</div>
    <div class="h-sub">A 1.58-bit ternary LLM</div>
  </div>
  <div class="h-badge">
    <div class="live-dot"></div>
    <span id="badge-text">live</span>
  </div>
</header>

<div class="messages" id="msgs">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🌿</div>
    <h2>Bonsai 1.7B</h2>
    <p>A 1.58-bit ternary language model.<br>
       Model: <a href="https://huggingface.co/prism-ml/Ternary-Bonsai-1.7B-mlx-2bit" target="_blank" rel="noopener">prism-ml/Ternary-Bonsai-1.7B-mlx-2bit</a><br>
       by <a href="https://huggingface.co/PrismML" target="_blank" rel="noopener">PrismML / Caltech</a></p>
  </div>
</div>

<div class="input-area">
  <textarea id="inp" placeholder="How can I help you today? (Enter to send, Shift+Enter for newline)" rows="1" autofocus></textarea>
  <button class="send" id="send-btn" title="Send">↑</button>
</div>

<script>
const msgsEl   = document.getElementById('msgs');
const welcomeEl= document.getElementById('welcome');
const inpEl    = document.getElementById('inp');
const sendBtn  = document.getElementById('send-btn');
const badgeEl  = document.getElementById('badge-text');

let busy = false;
let generating = false;

// Auto-resize textarea
inpEl.addEventListener('input', () => {
  inpEl.style.height = 'auto';
  inpEl.style.height = Math.min(inpEl.scrollHeight, 140) + 'px';
});

inpEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', () => {
  if (generating) {
    stopGeneration();
  } else {
    send();
  }
});

function scrollBottom() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function appendUser(text) {
  welcomeEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  msgsEl.appendChild(row);
  scrollBottom();
}

function appendBot() {
  const row = document.createElement('div');
  row.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  const cur = document.createElement('span');
  cur.className = 'cursor';
  b.appendChild(cur);
  row.appendChild(b);
  msgsEl.appendChild(row);
  scrollBottom();
  return { row, b, cur };
}

async function stopGeneration() {
  try {
    await fetch('/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
  } catch (e) {}
  generating = false;
  busy = false;
  sendBtn.innerHTML = '↑';
  sendBtn.className = 'send';
  sendBtn.disabled = false;
  inpEl.focus();
}

async function send() {
  const prompt = inpEl.value.trim();
  if (!prompt || busy) return;

  busy = true;
  generating = true;
  sendBtn.innerHTML = '⏹';
  sendBtn.className = 'stop';
  inpEl.value = '';
  inpEl.style.height = 'auto';

  appendUser(prompt);
  const { row, b, cur } = appendBot();
  let text = '';
  let lastFullText = '';

  const SYSTEM_PROMPT = "You are a helpful, concise assistant. Answer questions directly and clearly.";

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, max_new_tokens: 512, system_prompt: SYSTEM_PROMPT })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let d;
        try { d = JSON.parse(part.slice(6)); } catch (e) { 
          console.error('[SSE] JSON parse error:', e.message, 'data:', part.substring(0, 100));
          continue; 
        }

        if (d.stopped) {
          cur.remove();
          const s = document.createElement('div');
          s.className = 'stats';
          s.textContent = 'Stopped by user';
          row.appendChild(s);
          break;
        }

        if (d.done) {
          cur.remove();
          const s = document.createElement('div');
          s.className = 'stats';
          s.textContent =
            `${d.tokens_per_second.toFixed(1)} t/s · ${d.total_time_s.toFixed(1)}s · ${d.tokens_generated} tokens`;
          row.appendChild(s);
          badgeEl.textContent = `${d.tokens_per_second.toFixed(1)} t/s`;
        }

        if (d.token !== undefined) {
          text += d.token;
          if (d.full !== lastFullText) {
            b.innerHTML = escapeHtml(d.full) + '<span class="cursor"></span>';
            lastFullText = d.full;
          }
        }
      }
    }
  } catch (err) {
    cur.remove();
    b.classList.add('error');
    b.textContent = `Error: ${err.message}`;
  } finally {
    generating = false;
    busy = false;
    sendBtn.innerHTML = '↑';
    sendBtn.className = 'send';
    sendBtn.disabled = false;
    inpEl.focus();
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
